<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Вход — AIOS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/favicon.svg" />
  <meta name="application-name" content="AIOS" />
  <meta name="theme-color" content="#4ea1ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="/css/design-tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <script src="/scripts/theme.js"></script>
  <style>
    body {
      background: var(--bg);
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-logo">
        <h1>AIOS</h1>
        <p>AI Operating System — Персональный AI-помощник</p>
      </div>
      
      <div class="tabs tabs-full">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>
      
      <div class="msg-box msg-box-error" id="error" style="display:none;"></div>
      
      <!-- Форма входа -->
      <div class="form-section active" id="login-form">
        <form id="loginForm">
          <div class="form-group">
            <label for="login-username">Логин</label>
            <input type="text" id="login-username" class="input" name="username" required autocomplete="username" />
          </div>
          
          <div class="form-group">
            <label for="login-password">Пароль</label>
            <input type="password" id="login-password" class="input" name="password" required autocomplete="current-password" />
          </div>
          
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">Войти</button>
        </form>
      </div>
      
      <!-- Форма регистрации -->
      <div class="form-section" id="register-form" style="display:none;">
        <form id="registerForm">
          <div class="form-group">
            <label for="register-username">Логин</label>
            <input type="text" id="register-username" class="input" name="username" required autocomplete="username" />
          </div>
          
          <div class="form-group">
            <label for="register-email">Email (опционально)</label>
            <input type="email" id="register-email" class="input" name="email" autocomplete="email" />
          </div>
          
          <div class="form-group">
            <label for="register-password">Пароль</label>
            <input type="password" id="register-password" class="input" name="password" required autocomplete="new-password" />
          </div>
          
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="registerBtn">Зарегистрироваться</button>
        </form>
      </div>
    </div>
  </div>
  
  <script>
    // Переключение табов
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const tabName = tab.dataset.tab;
        
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        document.querySelectorAll('.form-section').forEach(f => f.style.display = 'none');
        document.getElementById(tabName + '-form').style.display = 'block';
        
        hideError();
      });
    });
    
    function showError(message) {
      const errorEl = document.getElementById('error');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }
    
    function hideError() {
      document.getElementById('error').style.display = 'none';
    }
    
    function setButtonLoading(btn, text, loadingText) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;margin-right:6px;"></span>' + loadingText;
    }
    
    function setButtonReady(btn, text) {
      btn.disabled = false;
      btn.textContent = text;
    }
    
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      
      const btn = document.getElementById('loginBtn');
      const btnOriginalText = btn.textContent;
      setButtonLoading(btn, btnOriginalText, 'Вход...');
      
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;
      
      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          window.location.href = '/';
        } else {
          showError(data.error || 'Ошибка входа');
        }
      } catch (err) {
        showError('Ошибка соединения с сервером');
      } finally {
        setButtonReady(btn, btnOriginalText);
      }
    });
    
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      
      const btn = document.getElementById('registerBtn');
      const btnOriginalText = btn.textContent;
      setButtonLoading(btn, btnOriginalText, 'Регистрация...');
      
      const username = document.getElementById('register-username').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      
      try {
        const response = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          window.location.href = '/';
        } else {
          showError(data.error || 'Ошибка регистрации');
        }
      } catch (err) {
        showError('Ошибка соединения с сервером');
      } finally {
        setButtonReady(btn, btnOriginalText);
      }
    });
    
    async function checkAuth() {
      try {
        const response = await fetch('/auth/check');
        const data = await response.json();
        
        if (data.authenticated) {
          window.location.href = '/';
        }
      } catch (err) {
        console.error('Auth check failed:', err);
      }
    }
    
    checkAuth();
  </script>
</body>
</html>
