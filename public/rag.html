<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG База Знаний — AIOS</title>
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/favicon.svg" />
  <meta name="application-name" content="AIOS" />
  <link rel="stylesheet" href="/css/design-tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <script src="/scripts/theme.js"></script>
  <style>
    .file-drop {
      border: 2px dashed var(--border-primary);
      border-radius: var(--radius-md);
      padding: var(--space-8);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .file-drop:hover { border-color: var(--accent); background: var(--accent-subtle); }
    .file-drop.dragover { border-color: var(--accent); background: var(--accent-subtle); }
    .file-drop input { display: none; }
    .file-drop-icon { font-size: 48px; color: var(--accent); margin-bottom: var(--space-3); }
    .file-drop-text { color: var(--text-secondary); }
    .result-content { color: var(--text-primary); font-size: var(--text-sm); line-height: var(--leading-relaxed); max-height: 100px; overflow-y: auto; }
    .result-meta { margin-top: var(--space-2); font-size: var(--text-xs); color: var(--text-tertiary); }
    @media (max-width: 768px) {
      body { padding: 0; }
    }
  </style>
</head>
<body class="programming-panel rag-container">
  
    <header class="app-header" style="position:sticky;top:0;border-radius:var(--radius-lg);margin-bottom:var(--space-5);">
      <div class="flex items-center gap-3">
        <h1 style="font-size:var(--text-xl);margin:0;">🧠 RAG База Знаний · AIOS</h1>
      </div>
      <div class="flex items-center gap-2">
        <button class="btn btn-icon" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <button class="btn btn-sm" onclick="window.location.href='/index.html'">К чату</button>
        <button class="btn btn-sm" onclick="window.location.href='/admin.html'">Админка</button>
        <button class="btn btn-danger btn-sm" onclick="logout()">Выход</button>
      </div>
    </header>

    <div class="stats-grid" id="stats-container">
      <div class="stat-item"><div class="stat-value" id="stat-total">-</div><div class="stat-label">Документов</div></div>
      <div class="stat-item"><div class="stat-value" id="stat-projects">-</div><div class="stat-label">Проектов</div></div>
      <div class="stat-item"><div class="stat-value" id="stat-docs">-</div><div class="stat-label">Текстовых файлов</div></div>
      <div class="stat-item"><div class="stat-value" id="stat-code">-</div><div class="stat-label">Файлов кода</div></div>
    </div>

    <div class="card" style="margin-top:var(--space-5);">
      <h2 style="padding-bottom:12px;border-bottom:1px solid var(--border-primary);margin-bottom:var(--space-5);">📤 Загрузка документов</h2>
      <div class="form-group">
        <label for="rag-project">Проект (опционально)</label>
        <select id="rag-project" class="input"><option value="">Общая база (без привязки)</option></select>
      </div>
      <div class="form-group">
        <label>Способ загрузки</label>
        <div class="file-drop" id="file-drop" onclick="document.getElementById('file-input').click()">
          <div class="file-drop-icon">📁</div>
          <div class="file-drop-text">
            <strong>Перетащите файл сюда</strong><br>или кликните для выбора<br>
            <small>Поддерживаются: TXT, MD, JSON, JS, TS, PY, SQL, PDF, DOCX</small>
          </div>
          <input type="file" id="file-input" accept=".txt,.md,.json,.js,.ts,.py,.sql,.pdf,.docx,.doc,.html,.css,.yaml,.yml">
        </div>
        <div id="file-name" class="text-small" style="margin-top:var(--space-2);"></div>
      </div>
      <div class="form-group">
        <label for="rag-category">Категория</label>
        <select id="rag-category" class="input">
          <option value="documentation">Документация</option>
          <option value="code">Код</option>
          <option value="faq">FAQ</option>
          <option value="guide">Гайд</option>
          <option value="general">Общее</option>
        </select>
      </div>
      <div class="form-group">
        <label for="rag-tags">Теги (через запятую)</label>
        <input type="text" id="rag-tags" class="input" placeholder="api, auth, example">
      </div>
<div id="upload-message"></div>
    </div>

    <div class="card" style="margin-top:var(--space-5);">
      <h2 style="padding-bottom:12px;border-bottom:1px solid var(--border-primary);margin-bottom:var(--space-5);">🔍 Поиск по базе знаний</h2>
      <div class="form-group">
        <label for="search-query">Поисковый запрос</label>
        <input type="text" id="search-query" class="input" placeholder="Введите запрос для поиска...">
      </div>
      <div class="form-group">
        <label for="search-limit">Количество результатов</label>
        <select id="search-limit" class="input">
          <option value="3">3</option>
          <option value="5" selected>5</option>
          <option value="10">10</option>
          <option value="20">20</option>
        </select>
      </div>
      <button class="btn btn-primary btn-full" onclick="searchKnowledge()">Найти</button>
      <div id="search-results" style="margin-top:var(--space-4);"></div>
    </div>

  <script>
    let currentUser = null;
    async function checkAuth() {
      try {
        const response = await fetch('/auth/check', { credentials: 'include' });
        const data = await response.json();
        if (!data.authenticated) { window.location.href = '/login.html'; return null; }
        currentUser = data.user;
        return data.user;
      } catch (err) { console.error('Auth error:', err); window.location.href = '/login.html'; return null; }
    }
    async function logout() {
      await fetch('/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/login.html';
    }
    async function loadProjects() {
      try {
        const response = await fetch('/projects', { credentials: 'include' });
        const projects = await response.json();
        const select = document.getElementById('rag-project');
        projects.forEach(project => {
          const option = document.createElement('option');
          option.value = project.id;
          option.textContent = project.name;
          select.appendChild(option);
        });
      } catch (err) { console.error('Error loading projects:', err); }
    }
    async function loadStats() {
      try {
        const response = await fetch('/api/rag/stats', { credentials: 'include' });
        const data = await response.json();
        if (data.success) {
          document.getElementById('stat-total').textContent = data.stats.total_documents || 0;
          document.getElementById('stat-projects').textContent = data.stats.projects_count || 0;
          document.getElementById('stat-docs').textContent = data.stats.documents || 0;
          document.getElementById('stat-code').textContent = data.stats.code_files || 0;
        }
      } catch (err) { console.error('Error loading stats:', err); }
    }
    const fileDrop = document.getElementById('file-drop');
    const fileInput = document.getElementById('file-input');
    const fileName = document.getElementById('file-name');
    fileDrop.addEventListener('dragover', (e) => { e.preventDefault(); fileDrop.classList.add('dragover'); });
    fileDrop.addEventListener('dragleave', () => { fileDrop.classList.remove('dragover'); });
    fileDrop.addEventListener('drop', (e) => {
      e.preventDefault();
      fileDrop.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) handleFile(files[0]);
    });
    fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) handleFile(e.target.files[0]); });
    function handleFile(file) { fileName.textContent = 'Выбран файл: ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)'; }
    async function uploadFile(file) {
      const messageDiv = document.getElementById('upload-message');
      messageDiv.innerHTML = '<div class="msg-box msg-box-warning">Загрузка и индексация...</div>';
      const formData = new FormData();
      formData.append('file', file);
      const projectId = document.getElementById('rag-project').value;
      if (projectId) formData.append('projectId', projectId);
      const category = document.getElementById('rag-category').value;
      const tags = document.getElementById('rag-tags').value;
      if (category) formData.append('category', category);
      if (tags) formData.append('tags', tags);
      try {
        const response = await fetch('/api/rag/index-file', { method: 'POST', credentials: 'include', body: formData });
        const result = await response.json();
        if (result.success) {
          messageDiv.innerHTML = '<div class="msg-box msg-box-success">✅ Файл успешно индексирован!<br>Создано чанков: ' + result.chunksCount + '</div>';
          loadStats();
          fileInput.value = '';
          fileName.textContent = '';
        } else {
          messageDiv.innerHTML = '<div class="msg-box msg-box-error">❌ Ошибка: ' + result.error + '</div>';
        }
      } catch (err) {
        messageDiv.innerHTML = '<div class="msg-box msg-box-error">❌ Ошибка загрузки: ' + err.message + '</div>';
      }
    }
    async function searchKnowledge() {
      const query = document.getElementById('search-query').value.trim();
      const limit = document.getElementById('search-limit').value;
      const resultsDiv = document.getElementById('search-results');
      if (!query) { resultsDiv.innerHTML = '<div class="msg-box msg-box-error">Введите поисковый запрос</div>'; return; }
      resultsDiv.innerHTML = '<div class="flex items-center gap-2 msg-box msg-box-info"><div class="spinner"></div><span>Поиск...</span></div>';
      try {
        const response = await fetch('/api/rag/search?q=' + encodeURIComponent(query) + '&limit=' + limit, { credentials: 'include' });
        const data = await response.json();
        if (data.success && data.results.length > 0) {
          let html = '<h3 style="margin-bottom:var(--space-4);">Найдено результатов: ' + data.count + '</h3>';
          data.results.forEach((result, index) => {
            html += '<div class="result-item">';
            html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-2);"><strong>Результат #' + (index + 1) + '</strong>';
            html += '<span class="badge badge-accent">' + (result.similarity * 100).toFixed(0) + '%</span></div>';
            html += '<div class="result-content">' + escapeHtml(result.content.substring(0, 300)) + (result.content.length > 300 ? '...' : '') + '</div>';
            html += '<div class="result-meta">';
            if (result.metadata && result.metadata.fileName) html += 'Файл: ' + escapeHtml(result.metadata.fileName) + ' | ';
            if (result.source && result.source.projectName) html += 'Проект: ' + escapeHtml(result.source.projectName) + ' | ';
            html += 'Чанк: ' + (result.chunkIndex || 0);
            html += '</div></div>';
          });
          resultsDiv.innerHTML = html;
        } else {
          resultsDiv.innerHTML = '<div class="msg-box msg-box-warning">Ничего не найдено</div>';
        }
      } catch (err) {
        resultsDiv.innerHTML = '<div class="msg-box msg-box-error">Ошибка поиска: ' + err.message + '</div>';
      }
    }
    function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    document.getElementById('search-query').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchKnowledge(); });
    checkAuth().then(() => { loadProjects(); loadStats(); });
  </script>
</body>
</html>
