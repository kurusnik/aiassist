<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>AI Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h2>AI Assistant</h2>

<select id="model"></select>

<h3>System prompt</h3>
<textarea id="systemPrompt" placeholder="Инструкция ассистенту"></textarea>
<button id="savePrompt">Сохранить</button>
<hr>

<select id="projectSelect"></select>
<button id="addProjectBtn">+ Проект</button>
<button id="deleteProjectBtn">Удалить</button>
<button id="resetChatBtn">Reset диалога</button>

<div id="chat"></div>

<textarea id="message" placeholder="Напиши сообщение..."></textarea>
<button id="sendBtn">Отправить</button>

<script type="module" src="app.js"></script>
</body>
</html>
