<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <title>Agents — AIOS Console</title>
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/favicon.svg" />
  <meta name="application-name" content="AIOS Console" />
  <meta name="theme-color" content="#4ea1ff" />
  <link rel="stylesheet" href="/css/design-tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/console.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <script src="/scripts/theme.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/notifications.js"></script>
</head>
<body>
  <div class="console-app">
    <nav class="console-nav">
      <div class="console-nav-header">
        <svg width="20" height="20" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="6" fill="url(#bgGrad)"/><defs><linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4ea1ff"/><stop offset="100%" style="stop-color:#7f5af0"/></linearGradient></defs><text x="16" y="22" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="system-ui,sans-serif">A</text></svg>
        <h1>AIOS</h1>
      </div>
      <div class="console-nav-items">
        <a href="/console.html" class="console-nav-item">Overview</a>
        <a href="/workflows.html" class="console-nav-item">Workflows</a>
        <a href="/approvals.html" class="console-nav-item">Approvals</a>
        <a href="/agents.html" class="console-nav-item active">Agents</a>
        <a href="/observability.html" class="console-nav-item">Observability</a>
      </div>
      <div class="console-nav-footer">
        <a href="/index.html" class="console-nav-item">Chat</a>
        <a href="/admin.html" class="console-nav-item">Admin</a>
        <a href="#" class="console-nav-item" id="logoutBtn">Logout</a>
      </div>
    </nav>
    <main class="console-main">
      <header class="console-header">
        <h2>Agent Management</h2>
        <div class="flex items-center gap-2">
          <span class="text-small" style="color:var(--text-secondary);" id="userDisplay"></span>
          <button class="btn btn-icon" id="themeToggle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
        </div>
      </header>
      <div class="console-content">
        <div class="section-divider">Agent Runtimes</div>
        <div class="console-card">
          <div class="console-card-header"><h3>Registered Agents</h3></div>
          <div class="console-card-body">
            <div class="console-table-wrap">
              <table class="console-table" id="agentTable">
                <thead><tr><th>Type</th><th>Name</th><th>Version</th><th>Status</th><th>Executions</th><th>Success Rate</th><th>Avg Duration</th><th>Actions</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="detailPanel" style="display:none;" class="console-card" style="margin-top:var(--space-4);">
          <div class="console-card-header">
            <h3 id="detailTitle">Agent Details</h3>
            <button class="btn btn-sm btn-ghost" onclick="closeDetail()">✕ Close</button>
          </div>
          <div class="console-card-body">
            <div class="detail-grid" id="detailGrid"></div>
            <div class="section-divider" style="margin-top:var(--space-4);">Recent Traces</div>
            <div class="graph-container" id="traceContainer" style="min-height:80px;"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    let allAgents = [];

    async function init() {
      const user = await AIOS.auth.checkAuth();
      if (!user) return;
      document.getElementById('userDisplay').textContent = '👤 ' + user.username;
      document.getElementById('themeToggle').addEventListener('click', () => {
        const t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('theme', t);
      });
      document.getElementById('logoutBtn').addEventListener('click', (e) => { e.preventDefault(); AIOS.auth.logout(); });
      await loadAgents();
    }

    async function loadAgents() {
      const api = window.AIOS.apiClient;
      const res = await api.getAgents().catch(() => ({ success: false, agents: [], total: 0 }));
      if (res.success) {
        allAgents = res.agents || [];
        renderAgents();
      }
    }

    function renderAgents() {
      const tbody = document.querySelector('#agentTable tbody');
      tbody.innerHTML = '';
      if (allAgents.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-secondary);padding:var(--space-6);">No agents registered</td></tr>';
        return;
      }
      allAgents.forEach(a => {
        const statusClass = (a.status || 'enabled').toLowerCase();
        const successRate = a.successRate != null ? (a.successRate * 100).toFixed(0) + '%' : '—';
        const avgDur = a.avgDuration != null ? a.avgDuration.toFixed(0) + 'ms' : '—';
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><span class="badge-aios badge-aios-default">${a.type || '—'}</span></td>
          <td>${a.name || a.type || '—'}</td>
          <td>${a.version || '—'}</td>
          <td><span class="status-indicator"><span class="status-dot ${statusClass}"></span>${a.status || 'unknown'}</span></td>
          <td>${a.executions ?? '—'}</td>
          <td>${successRate}</td>
          <td>${avgDur}</td>
          <td>
            <button class="btn-console-action" onclick="inspectAgent('${a.type}')">Inspect</button>
            ${a.status === 'enabled' || a.status === 'active' ? `<button class="btn-console-action" onclick="toggleAgent('${a.type}', 'disable')">Disable</button>` : `<button class="btn-console-action" onclick="toggleAgent('${a.type}', 'enable')">Enable</button>`}
          </td>`;
        row.addEventListener('click', () => inspectAgent(a.type));
        tbody.appendChild(row);
      });
    }

    async function inspectAgent(type) {
      const api = window.AIOS.apiClient;
      const res = await api.getAgent(type).catch(() => ({ success: false }));
      const a = res.success ? res.agent : allAgents.find(x => x.type === type);
      if (!a) return;

      document.getElementById('detailPanel').style.display = 'block';
      document.getElementById('detailTitle').textContent = 'Agent: ' + (a.name || a.type);
      document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth' });

      const grid = document.getElementById('detailGrid');
      grid.innerHTML = '';
      const fields = [
        ['Type', a.type],
        ['Name', a.name],
        ['Version', a.version],
        ['Status', a.status],
        ['Handler', a.handlerType],
        ['Executions', a.executions],
        ['Success Count', a.successCount],
        ['Success Rate', a.successRate != null ? (a.successRate * 100).toFixed(1) + '%' : '—'],
        ['Avg Duration', a.avgDuration != null ? a.avgDuration.toFixed(0) + 'ms' : '—'],
        ['Total Duration', a.totalDuration != null ? a.totalDuration.toFixed(0) + 'ms' : '—']
      ];
      fields.forEach(([label, value]) => {
        const div = document.createElement('div');
        div.className = 'detail-row';
        div.innerHTML = `<span class="detail-label">${label}</span><span class="detail-value">${value != null ? value : '—'}</span>`;
        grid.appendChild(div);
      });

      document.getElementById('traceContainer').innerHTML = '<div class="empty-state"><div class="empty-state-text">Trace viewer — coming in Phase 11.6</div></div>';
    }

    function closeDetail() {
      document.getElementById('detailPanel').style.display = 'none';
    }

    async function toggleAgent(type, action) {
      const api = window.AIOS.apiClient;
      const user = document.getElementById('userDisplay').textContent.replace('👤 ', '');
      let res;
      if (action === 'enable') res = await api.enableAgent(type, user, 'operator action');
      else res = await api.disableAgent(type, user, 'operator action');
      if (res.success) {
        AIOS.notify.success(`Agent ${action}d`);
        await loadAgents();
      } else {
        AIOS.notify.error(res.error || `Failed to ${action} agent`);
      }
    }

    init();
  </script>
</body>
</html>
