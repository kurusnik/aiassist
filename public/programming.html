<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programming Engine</title>
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f1216 0%, #141a22 100%);
      min-height: 100vh;
      padding: 20px;
      color: #e6edf3;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .header {
      background: linear-gradient(180deg, #141a22, #18202a);
      padding: 24px 30px;
      border-radius: 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #243041;
    }
    .header h1 { margin: 0; font-size: 24px; }
    .header-actions { display: flex; gap: 10px; }
    .btn {
      padding: 10px 20px;
      border: 1px solid #243041;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      background: #101722;
      color: #e6edf3;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: .15s ease;
    }
    .btn:hover { border-color: #4ea1ff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; border-color: #243041; }
    .btn-danger { background: #2a1518; border-color: #542127; color: #ffb3b3; }
    .btn-primary {
      background: linear-gradient(135deg, #3a7bd9, #7f5af0);
      border-color: transparent;
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-primary:disabled { filter: none; opacity: .6; }

    .card {
      background: linear-gradient(180deg, #141a22, #18202a);
      border-radius: 14px;
      padding: 30px;
      border: 1px solid #243041;
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 28px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #4ea1ff, #7f5af0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card .version {
      color: #9fb0c0;
      font-size: 16px;
      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      background: #0f141b;
      color: #e6edf3;
      border: 1px solid #243041;
      border-radius: 10px;
      padding: 14px 16px;
      outline: none;
      font-size: 15px;
      font-family: inherit;
      line-height: 1.6;
      resize: vertical;
      transition: .15s ease;
    }
    textarea:focus { border-color: #4ea1ff; box-shadow: 0 0 0 3px rgba(78,161,255,.15); }

    .generate-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-top: 16px;
    }
    .generate-row .btn { padding: 12px 28px; font-size: 15px; white-space: nowrap; }

    .status-bar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #0f141b;
      border: 1px solid #243041;
      border-radius: 10px;
      margin-top: 16px;
      font-size: 14px;
    }
    .status-bar.visible { display: flex; }
    .status-bar .spinner {
      width: 16px; height: 16px;
      border: 2px solid #2d3a4d;
      border-top-color: #4ea1ff;
      border-radius: 50%;
      animation: spin .9s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-bar .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #16c47f;
      box-shadow: 0 0 10px rgba(22,196,127,.6);
      flex-shrink: 0;
    }
    .status-bar.done { border-color: #1a3a2a; }

    .result-block {
      background: linear-gradient(180deg, #141a22, #18202a);
      border-radius: 14px;
      border: 1px solid #243041;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .result-block .result-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 20px;
      border-bottom: 1px solid #243041;
      font-size: 14px;
      font-weight: 600;
      color: #9fb0c0;
    }
    .result-block .result-header .icon { font-size: 18px; }
    .result-block .result-body { padding: 0; }
    .result-block pre {
      margin: 0;
      padding: 20px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 14px;
      line-height: 1.6;
      color: #e6edf3;
      background: #0b1118;
    }
    .result-block pre code { font-family: inherit; }
    .result-block .explanation-body {
      padding: 20px;
      line-height: 1.7;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .result-block.hidden { display: none; }

    .error-block {
      background: #2a1518;
      border: 1px solid #542127;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
      color: #ffb3b3;
      font-size: 14px;
      line-height: 1.6;
    }
    .error-block.hidden { display: none; }

    @media (max-width: 768px) {
      .header { flex-direction: column; gap: 12px; text-align: center; }
      .generate-row { flex-direction: column; }
      .generate-row .btn { width: 100%; justify-content: center; }
      .card { padding: 20px; }
      .result-block pre { padding: 14px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Programming Engine</h1>
      <div class="header-actions">
        <button class="btn" onclick="window.location.href='/index.html'">Чат</button>
        <button class="btn" onclick="window.location.href='/rag.html'">RAG</button>
        <button class="btn" onclick="window.location.href='/admin.html'">Админка</button>
        <button class="btn btn-danger" onclick="logout()">Выход</button>
      </div>
    </div>

    <div class="card">
      <h2>Генерация кода</h2>
      <div class="version">Опишите задачу — Engine выполнит Pipeline</div>

      <div style="margin-bottom: 16px;">
        <label style="display:block;margin-bottom:6px;color:#9fb0c0;font-size:14px;">Проект</label>
        <select id="projectSelect" style="width:100%;background:#0f141b;color:#e6edf3;border:1px solid #243041;border-radius:10px;padding:12px 16px;outline:none;font-size:15px;">
          <option value="">— Без проекта —</option>
        </select>
      </div>

      <textarea id="taskInput" rows="6" placeholder="Опишите задачу...

Например:
Создай обработку инвентаризации товаров."></textarea>

      <div class="generate-row">
        <button class="btn btn-primary" id="generateBtn">Сгенерировать</button>
      </div>

      <div class="status-bar" id="statusBar">
        <div class="spinner" id="statusSpinner"></div>
        <span id="statusText">Выполняется генерации...</span>
      </div>
    </div>

    <div class="result-block hidden" id="codeBlock">
      <div class="result-header">
        <span class="icon">&#x1F4C4;</span>
        <span>Сгенерированный код</span>
      </div>
      <div class="result-body">
        <pre><code id="codeContent"></code></pre>
      </div>
    </div>

    <div class="result-block hidden" id="explanationBlock">
      <div class="result-header">
        <span class="icon">&#x1F4DD;</span>
        <span>Объяснение</span>
      </div>
      <div class="result-body">
        <div class="explanation-body" id="explanationContent"></div>
      </div>
    </div>

    <div class="error-block hidden" id="errorBlock">
      <div id="errorContent"></div>
    </div>
  </div>

  <script>
    async function checkAuth() {
      try {
        const response = await fetch('/auth/check', { credentials: 'include' });
        const data = await response.json();
        if (!data.authenticated) { window.location.href = '/login.html'; return null; }
        return data.user;
      } catch (err) { window.location.href = '/login.html'; return null; }
    }
    async function logout() {
      await fetch('/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/login.html';
    }

    const taskInput = document.getElementById('taskInput');
    const generateBtn = document.getElementById('generateBtn');
    const projectSelect = document.getElementById('projectSelect');
    const statusBar = document.getElementById('statusBar');
    const statusText = document.getElementById('statusText');
    const statusSpinner = document.getElementById('statusSpinner');
    const codeBlock = document.getElementById('codeBlock');
    const codeContent = document.getElementById('codeContent');
    const explanationBlock = document.getElementById('explanationBlock');
    const explanationContent = document.getElementById('explanationContent');
    const errorBlock = document.getElementById('errorBlock');
    const errorContent = document.getElementById('errorContent');

    function setStatus(text, done) {
      statusBar.classList.add('visible');
      statusText.textContent = text;
      statusSpinner.style.display = done ? 'none' : '';
      statusBar.classList.toggle('done', !!done);
    }

    function hideStatus() {
      statusBar.classList.remove('visible');
    }

    function showError(msg) {
      errorContent.textContent = msg;
      errorBlock.classList.remove('hidden');
    }

    function hideError() {
      errorBlock.classList.add('hidden');
    }

    function showResult(data) {
      if (data.code) {
        codeContent.textContent = data.code;
        codeBlock.classList.remove('hidden');
      }
      if (data.explanation) {
        explanationContent.textContent = data.explanation;
        explanationBlock.classList.remove('hidden');
      }
    }

    function hideResults() {
      codeBlock.classList.add('hidden');
      explanationBlock.classList.add('hidden');
    }

    generateBtn.addEventListener('click', async () => {
      const text = taskInput.value.trim();
      if (!text) {
        showError('Пожалуйста, опишите задачу.');
        return;
      }

      hideError();
      hideResults();
      hideStatus();
      generateBtn.disabled = true;
      generateBtn.textContent = 'Генерация...';
      setStatus('Выполняется генерация...');

      try {
        const body = { text };
        const projectId = projectSelect.value;
        if (projectId) body.projectId = parseInt(projectId, 10);

        const res = await fetch('/api/programming/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (!res.ok) {
          setStatus('Ошибка', true);
          showError(data.error || 'Произошла ошибка при выполнении запроса.');
          return;
        }

        if (data.success) {
          setStatus('Готово', true);
          showResult(data);
        } else {
          setStatus('Ошибка', true);
          const errMsg = data.errors && data.errors.length > 0
            ? data.errors.map(e => e.message || e).join('; ')
            : 'Pipeline завершился с ошибкой.';
          showError(errMsg);
        }
      } catch (err) {
        setStatus('Ошибка', true);
        showError('Не удалось подключиться к серверу. Проверьте соединение.');
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Сгенерировать';
      }
    });

    checkAuth();

    fetch('/api/projects', { credentials: 'include' })
      .then(r => r.json())
      .then(projects => {
        projectSelect.innerHTML = '<option value="">— Без проекта —</option>';
        projects.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.name;
          projectSelect.appendChild(opt);
        });
      })
      .catch(() => {});
  </script>
</body>
</html>
