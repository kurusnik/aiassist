<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programming Engine — AIOS</title>
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/favicon.svg" />
  <meta name="application-name" content="AIOS" />
  <link rel="stylesheet" href="/css/design-tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <script src="/scripts/theme.js"></script>
<style>
    .version { color: var(--text-tertiary); font-size: var(--text-sm); margin-bottom: var(--space-6); }
  </style>
</head>
<body class="programming-panel">
  
    <header class="app-header" style="position:sticky;top:0;border-radius:var(--radius-lg);margin-bottom:var(--space-5);">
      <h1 style="font-size:var(--text-xl);margin:0;">Programming Engine · AIOS</h1>
      <div class="flex items-center gap-2">
        <button class="btn btn-icon" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <button class="btn btn-sm" onclick="window.location.href='/index.html'">Чат</button>
        <button class="btn btn-sm" onclick="window.location.href='/admin.html'">Админка</button>
        <button class="btn btn-danger btn-sm" onclick="logout()">Выход</button>
      </div>
    </header>

    <div class="card">
      <h2>Генерация кода</h2>
      <div class="version" style="color:var(--text-tertiary);font-size:var(--text-sm);margin-bottom:var(--space-6);">Опишите задачу — Engine выполнит Pipeline</div>

      <div class="form-group">
        <label for="projectSelect">Проект</label>
        <select id="projectSelect" class="input">
          <option value="">— Без проекта —</option>
        </select>
      </div>

      <div class="form-group">
        <textarea id="taskInput" class="input" rows="6" placeholder="Опишите задачу...

Например:
Создай обработку инвентаризации товаров."></textarea>
      </div>

      <button class="btn btn-primary btn-lg" id="generateBtn">Сгенерировать</button>

      <div class="flex items-center gap-2 msg-box msg-box-info" id="statusBar" style="display:none;">
        <div class="spinner" id="statusSpinner"></div>
        <span id="statusText">Выполняется генерация...</span>
      </div>
    </div>

    <div class="card" id="codeBlock" style="display:none;padding:0;overflow:hidden;">
      <div style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-4);border-bottom:1px solid var(--border-primary);font-weight:600;color:var(--text-secondary);font-size:var(--text-sm);">
        <span>📄</span>
        <span>Сгенерированный код</span>
      </div>
      <pre style="margin:0;padding:var(--space-5);overflow-x:auto;background:var(--bg-inset);"><code id="codeContent"></code></pre>
    </div>

    <div class="card" id="explanationBlock" style="display:none;padding:0;overflow:hidden;">
      <div style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-4);border-bottom:1px solid var(--border-primary);font-weight:600;color:var(--text-secondary);font-size:var(--text-sm);">
        <span>📝</span>
        <span>Объяснение</span>
      </div>
      <div style="padding:var(--space-5);line-height:var(--leading-relaxed);font-size:var(--text-md);white-space:pre-wrap;" id="explanationContent"></div>
    </div>

    <div class="msg-box msg-box-error" id="errorBlock" style="display:none;">
      <div id="errorContent"></div>
    </div>

  <script>
    async function checkAuth() {
      try {
        const response = await fetch('/auth/check', { credentials: 'include' });
        const data = await response.json();
        if (!data.authenticated) { window.location.href = '/login.html'; return null; }
        return data.user;
      } catch (err) { window.location.href = '/login.html'; return null; }
    }
    
    async function logout() {
      await fetch('/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/login.html';
    }

    const taskInput = document.getElementById('taskInput');
    const generateBtn = document.getElementById('generateBtn');
    const projectSelect = document.getElementById('projectSelect');
    const statusBar = document.getElementById('statusBar');
    const statusText = document.getElementById('statusText');
    const statusSpinner = document.getElementById('statusSpinner');
    const codeBlock = document.getElementById('codeBlock');
    const codeContent = document.getElementById('codeContent');
    const explanationBlock = document.getElementById('explanationBlock');
    const explanationContent = document.getElementById('explanationContent');
    const errorBlock = document.getElementById('errorBlock');
    const errorContent = document.getElementById('errorContent');

    function setStatus(text, done) {
      statusBar.style.display = 'flex';
      statusText.textContent = text;
      statusSpinner.style.display = done ? 'none' : '';
      statusBar.className = done ? 'flex items-center gap-2 msg-box msg-box-success' : 'flex items-center gap-2 msg-box msg-box-info';
    }

    function hideStatus() {
      statusBar.style.display = 'none';
    }

    function showError(msg) {
      errorContent.textContent = msg;
      errorBlock.style.display = 'block';
    }

    function hideError() {
      errorBlock.style.display = 'none';
    }

    function showResult(data) {
      if (data.code) {
        codeContent.textContent = data.code;
        codeBlock.style.display = 'block';
      }
      if (data.explanation) {
        explanationContent.textContent = data.explanation;
        explanationBlock.style.display = 'block';
      }
    }

    function hideResults() {
      codeBlock.style.display = 'none';
      explanationBlock.style.display = 'none';
    }

    generateBtn.addEventListener('click', async () => {
      const text = taskInput.value.trim();
      if (!text) { showError('Пожалуйста, опишите задачу.'); return; }

      hideError();
      hideResults();
      hideStatus();
      generateBtn.disabled = true;
      generateBtn.textContent = 'Генерация...';
      setStatus('Выполняется генерация...');

      try {
        const body = { text };
        const projectId = projectSelect.value;
        if (projectId) body.projectId = parseInt(projectId, 10);

        const res = await fetch('/api/programming/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (!res.ok) {
          setStatus('Ошибка', true);
          showError(data.error || 'Произошла ошибка при выполнении запроса.');
          return;
        }

        if (data.success) {
          setStatus('Готово', true);
          showResult(data);
        } else {
          setStatus('Ошибка', true);
          const errMsg = data.errors && data.errors.length > 0
            ? data.errors.map(e => e.message || e).join('; ')
            : 'Pipeline завершился с ошибкой.';
          showError(errMsg);
        }
      } catch (err) {
        setStatus('Ошибка', true);
        showError('Не удалось подключиться к серверу. Проверьте соединение.');
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Сгенерировать';
      }
    });

    checkAuth();

    fetch('/api/projects', { credentials: 'include' })
      .then(r => r.json())
      .then(projects => {
        projectSelect.innerHTML = '<option value="">— Без проекта —</option>';
        projects.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.name;
          projectSelect.appendChild(opt);
        });
      })
      .catch(() => {});
  </script>
</body>
</html>
