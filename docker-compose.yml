services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://ai_user:ai_password@db:5432/ai_assistant
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  db:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_DB=ai_assistant
      - POSTGRES_USER=ai_user
      - POSTGRES_PASSWORD=ai_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
  llama:
   container_name: llama
   image: ghcr.io/ggml-org/llama.cpp:server
   command:
     - -m
     - /models/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf
     - --host
     - 0.0.0.0
     - --port
     - "8080"
     - -c
     - "4096"
     - -t
     - "4"
   volumes:
     - ./models:/models
   ports:
     - "8080:8080"
   restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/var/www/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped

  certbot:
    profiles: ["setup"]
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot -d botnet.cuperstore.ru --non-interactive --agree-tos --email ${CERTBOT_EMAIL:-admin@botnet.cuperstore.ru}

  certbot-renew:
    image: certbot/certbot
    container_name: certbot-renew
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: >
      sh -c "while :; do
      certbot renew --webroot -w /var/www/certbot --disable-hook-validation \
      --deploy-hook 'python3 -c \"import socket, http.client; s = socket.socket(socket.AF_UNIX); s.connect(chr(47)+chr(118)+chr(97)+chr(114)+chr(47)+chr(114)+chr(117)+chr(110)+chr(47)+chr(100)+chr(111)+chr(99)+chr(107)+chr(101)+chr(114)+chr(46)+chr(115)+chr(111)+chr(99)+chr(107)); c = http.client.HTTPConnection(\"localhost\"); c.sock = s; c.request(\"POST\", \"/containers/nginx/kill?signal=HUP\"); c.getresponse()\"';
      sleep 12h;
      done"
    restart: always

volumes:
  postgres_data:
  uploads:
  logs:

networks:
  default:
    name: ai-assistant-network
